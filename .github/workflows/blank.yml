name: CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build1:
    name: Build 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run single-line script
        run: echo "Hello, world!"

  build2:
    name: Build 2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run single-line script
        run: echo "asri"

  build3:
    name: Build 3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Current Date and Time
        run: date

  build4:
    name: Build 4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Current Working Directory
        run: pwd

  build5:
    name: Build 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List All Files and Directories
        run: ls -la

  build6:
    name: Build 6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Completion Message
        run: echo "COMPLETED"
